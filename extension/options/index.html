<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LogSearch 设置</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <main class="page narrow">
    <header><p class="eyebrow">LOGSEARCH</p><h1>连接设置</h1><p class="muted">每行一个节点：名称、空格、地址。地址不要包含 RPC 方法路径。</p></header>
    <section class="card form">
      <label>节点地址<textarea id="nodes" rows="8" placeholder="node-01 https://node-01.example.internal:9443"></textarea></label>
      <label>Bearer Token<input id="token" type="password" autocomplete="off"></label>
      <div class="grid-two">
        <label>超时（秒）<input id="timeout" type="number" min="1" max="60"></label>
        <label>并发节点数<input id="concurrency" type="number" min="1" max="20"></label>
      </div>
      <label>Request ID 请求头（逗号分隔）<input id="headers" type="text"></label>
      <div class="actions"><button id="save" class="primary">保存设置</button><span id="status" class="muted"></span></div>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LogSearch</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><p class="eyebrow">DISTRIBUTED LOG TRACE</p><h1>LogSearch</h1></div>
      <button id="settings" class="ghost">连接设置</button>
    </header>
    <section class="card form">
      <div class="grid-request">
        <label>Network 请求<select id="requests"><option value="">点击刷新读取请求</option></select></label>
        <button id="refresh" class="ghost align-end">刷新请求</button>
      </div>
      <label>Request ID / 关键词<input id="keywords" type="text" placeholder="自动提取，也可以输入多个关键词并用逗号分隔"></label>
      <div class="grid-four">
        <label>匹配方式<select id="mode"><option value="KEYWORD_MODE_ALL">全部关键词在同一行</option><option value="KEYWORD_MODE_ANY">任一关键词</option></select></label>
        <label>前文行数<input id="before" type="number" min="0" max="100" value="2"></label>
        <label>后文行数<input id="after" type="number" min="0" max="100" value="2"></label>
        <label>最大结果数<input id="maxResults" type="number" min="1" max="5000" value="500"></label>
      </div>
      <div class="actions"><button id="search" class="primary">查询所有节点</button><span id="summary" class="muted"></span></div>
    </section>
    <section id="errors" class="errors"></section>
    <section id="results" class="results"></section>
  </main>
  <script src="index.js"></script>
</body>
</html>

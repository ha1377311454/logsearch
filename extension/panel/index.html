<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LogSearch</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><p class="eyebrow">DISTRIBUTED LOG TRACE</p><h1>LogSearch</h1></div>
      <button id="settings" class="ghost">连接设置</button>
    </header>
    <section class="network-layout">
      <aside class="request-pane" aria-label="Network 请求列表">
        <div class="request-toolbar">
          <input id="requestFilter" type="search" placeholder="筛选请求" aria-label="筛选请求">
          <button id="refresh" class="icon-button" title="刷新请求" aria-label="刷新请求">↻</button>
        </div>
        <div class="request-columns" aria-hidden="true">
          <span>名称</span><span>方法</span><span>状态</span>
        </div>
        <div id="requestList" class="request-list" role="listbox" aria-label="Network 请求"></div>
        <div id="requestCount" class="request-count">0 个请求</div>
      </aside>
      <div class="query-pane">
        <div id="selectedRequest" class="selected-request muted">请从左侧选择一个请求，或直接输入关键词</div>
        <section class="query-form form">
          <label>Request ID / 关键词<input id="keywords" type="text" placeholder="选择请求后自动提取，也可以输入多个关键词并用逗号分隔"></label>
          <div class="grid-four">
            <label>匹配方式<select id="mode"><option value="KEYWORD_MODE_ALL">全部关键词在同一行</option><option value="KEYWORD_MODE_ANY">任一关键词</option></select></label>
            <label>前文行数<input id="before" type="number" min="0" max="100" value="0"></label>
            <label>后文行数<input id="after" type="number" min="0" max="100" value="0"></label>
            <label>最大结果数<input id="maxResults" type="number" min="1" max="50000" value="5000"></label>
          </div>
          <div class="actions"><button id="search" class="primary">查询所有节点</button><span id="summary" class="muted"></span></div>
        </section>
        <section id="errors" class="errors"></section>
        <section id="results" class="results"></section>
      </div>
    </section>
  </main>
  <dialog id="settingsDialog" class="settings-dialog">
    <header class="dialog-head">
      <div>
        <h2>连接设置</h2>
        <p>配置需要查询的 Agent 节点。</p>
      </div>
      <button id="closeSettings" class="icon-button" aria-label="关闭设置">×</button>
    </header>
    <section class="dialog-body form">
      <label>节点地址
        <textarea id="settingsNodes" rows="6" spellcheck="false" placeholder="node-01 http://10.0.0.11:30900&#10;node-02 http://10.0.0.12:30900"></textarea>
        <span class="field-help">每行一个节点，格式为“名称 地址”；也可以只填写地址。</span>
      </label>
      <label>Bearer Token
        <input id="settingsToken" type="password" autocomplete="off" placeholder="无鉴权时留空">
      </label>
      <div class="grid-two">
        <label>请求超时（秒）<input id="settingsTimeout" type="number" min="1" max="60"></label>
        <label>并发节点数<input id="settingsConcurrency" type="number" min="1" max="20"></label>
      </div>
      <label>Request ID 请求头
        <input id="settingsHeaders" type="text" placeholder="x-request-id, x-trace-id, trace-id, traceparent">
        <span class="field-help">按从左到右的顺序提取，使用逗号分隔。</span>
      </label>
    </section>
    <footer class="dialog-actions">
      <span id="settingsStatus" class="muted" role="status"></span>
      <div>
        <button id="cancelSettings">取消</button>
        <button id="saveSettings" class="primary">保存</button>
      </div>
    </footer>
  </dialog>
  <script src="index.js"></script>
</body>
</html>

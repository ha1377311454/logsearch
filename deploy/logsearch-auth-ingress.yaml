apiVersion: v1
kind: Namespace
metadata:
  name: logsearch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logsearch-agent
  namespace: logsearch
data:
  agent.yaml: |
    server:
      listen: ":9000"
      node_name: ""
    search:
      roots: ["/host/var/log/pods"]
      allowed_extensions: [".log"]
      # Agent 只读取 Pod 名包含下列任一关键词的日志；空数组表示不过滤。
      pod_name_contains: []
      process_logs:
        - name: example-api
          comm_regex: '^java$'
          cmdline_regex: 'example-api'
          include_regex: '^/var/log/example-api/example-api(?:\..+)?\.log$'
          log_dirs: ["/var/log/example-api"]
          file_patterns: ["example-api*.log"]
          max_files: 20
          max_file_age: 48h
          multiline:
            start_pattern: '^(?:(?:(?:[0-9]{4}[-/])?[0-9]{2}[-/][0-9]{2})[ T])?[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.,][0-9]{3,9})?(?:Z|[+-][0-9]{2}:?[0-9]{2})?'
      max_concurrent_searches: 4
      max_files_per_request: 200
      default_max_results: 500
      hard_max_results: 5000
      default_timeout: 15s
      hard_timeout: 60s
      max_response_bytes: 20971520
      max_line_bytes: 1048576
      max_multiline_bytes: 4194304
      max_multiline_lines: 1000
    security:
      token: ""
      allowed_origins: ["*"]
---
# 部署前必须替换此占位值。生产环境也可以删除本段，改为独立管理同名 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: logsearch-agent
  namespace: logsearch
type: Opaque
stringData:
  token: "REPLACE_WITH_A_LONG_RANDOM_TOKEN"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logsearch-agent
  namespace: logsearch
spec:
  selector:
    matchLabels:
      app: logsearch-agent
  template:
    metadata:
      labels:
        app: logsearch-agent
    spec:
      # process_logs 需要看到节点上的容器进程及其 /proc/<pid>/root。
      hostPID: true
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: ghcr.io/OWNER/REPOSITORY:v0.1.0
          args: ["-config", "/etc/logsearch/agent.yaml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOGSEARCH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logsearch-agent
                  key: token
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - DAC_READ_SEARCH
                - FOWNER
                - FSETID
                - SYS_RESOURCE
                - SYS_CHROOT
                - SYS_PTRACE
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            # SELinux Enforcing 节点上允许非特权采集器读取 hostPath 日志。
            seLinuxOptions:
              type: spc_t
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/logsearch
              readOnly: true
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: logsearch-agent
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: logsearch-agent
  namespace: logsearch
spec:
  type: ClusterIP
  selector:
    app: logsearch-agent
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logsearch-agent
  namespace: logsearch
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "65"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - logsearch.example.com
      secretName: logsearch-tls
  rules:
    - host: logsearch.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logsearch-agent
                port:
                  number: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logsearch-agent-ingress
  namespace: logsearch
spec:
  podSelector:
    matchLabels:
      app: logsearch-agent
  policyTypes: ["Ingress"]
  ingress:
    # 按实际 Ingress Controller 所在网段修改。
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 9000
